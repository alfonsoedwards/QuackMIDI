<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4EC6DF">
<title>Quack MIDI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon5a-192.png">
<link rel="apple-touch-icon" href="icon5a-192.png">
<style>
@font-face{font-family:Nunito;src:url(nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
/* Paleta Quack (igual que Quack Notes): calipso, blanco, crema de las hojas y el gris cálido del navegador */
:root{--bg:#F6F4F2;--sf:#FFFFFF;--sf2:#F1EEEB;--sf3:#E5E1DD;--tx:#333333;--tx2:#555555;--mu:#888888;--ac:#4EC6DF;--aci:#FFFFFF;--ack:#1A6B7D;
  --ok:#5BD6A0;--wa:#F2A541;--er:#E05B4B;--ln:#E5E1DD;--sh:0 8px 28px #0002;--r:14px;--sheet:#F4E4D7;--sheetln:#E3CDBB;--bar:#4EC6DF;color-scheme:light}
:root[data-theme=dark]{--bg:#1C1B1A;--sf:#262422;--sf2:#2F2C29;--sf3:#3A3633;--tx:#EDEAE6;--tx2:#C9C4BE;--mu:#9A948E;--ac:#4EC6DF;--aci:#FFFFFF;--ack:#7FD9EB;
  --er:#EE7667;--ln:#35322F;--sh:0 8px 28px #0008;--sheet:#3A332C;--sheetln:#4A4138;color-scheme:dark}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--sf2);padding:.55em .9em;font-weight:700;transition:filter .15s,transform .05s}
button:active{transform:scale(.97)}button:hover{filter:brightness(1.12)}
button.ac{background:var(--ac);color:var(--aci)}button.er{background:var(--er);color:#fff}button.gh{background:transparent}
button:disabled{opacity:.4;pointer-events:none}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:.45em .6em;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{width:100%;resize:vertical}
h2{font-size:1.15rem;margin:0 0 .6em;font-weight:800}h3{font-size:1rem;margin:1em 0 .5em;font-weight:800;color:var(--mu)}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:.6em;padding:.6em max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:.45em;font-weight:900;font-size:1.2rem;letter-spacing:.2px}
.brand b{color:var(--ac)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:.4em;border-radius:99px;padding:.25em .75em;font-size:.85rem;font-weight:800;background:var(--sf2);white-space:nowrap}
.pill i{width:.6em;height:.6em;border-radius:50%;background:var(--ok)}
.pill.un i{background:var(--wa)}.pill.er i{background:var(--er)}.pill.off i{background:var(--mu)}
.tabs{display:flex;gap:.3em;overflow-x:auto;padding:.5em 16px;scrollbar-width:none;position:sticky;top:57px;z-index:19;background:var(--bg)}
.tabs button{background:transparent;color:var(--mu);white-space:nowrap}
.tabs button.on{background:var(--sf2);color:var(--tx)}
main{padding:8px 16px;max-width:1200px;margin:0 auto}
.card{background:var(--sf);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:var(--sh)}
.row{display:flex;gap:.6em;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:.4em}
.mu{color:var(--mu)}.sm{font-size:.85rem}
.grow{flex:1;min-width:0}
.banner{background:var(--wa);color:#2a1a00;border-radius:12px;padding:.7em 1em;margin:0 0 12px;font-weight:700;display:flex;gap:.6em;align-items:center}
.banner.er{background:var(--er);color:#fff}
/* ---- En vivo ---- */
.live-now{text-align:center;padding:10px 0}
.live-song{font-size:1.1rem;font-weight:800;color:var(--mu)}
.live-chord{font-size:clamp(3rem,14vw,6rem);font-weight:900;line-height:1.05;color:var(--ac)}
.live-next{color:var(--mu);font-weight:700}
.bigbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bigbtns button{padding:1em;font-size:1.05rem}
/* ---- Tarjetas de acorde (horizontal) ---- */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;align-items:stretch}
.strip.wrap{flex-wrap:wrap;overflow:visible}
.cc{position:relative;flex:0 0 auto;min-width:78px;background:var(--sf2);border-radius:12px;padding:.5em .6em;border:2px solid transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;text-align:center}
.cc .nm{font-weight:900;font-size:1.15rem}
.cc .nt{font-size:.72rem;color:var(--mu)}
.cc .ly{font-size:.72rem;color:var(--mu);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
.cc.sel{border-color:var(--ac)}
.cc.msel{border-color:var(--wa)}
.cc.sil .nm{color:var(--mu)}
.cc .del{position:absolute;top:-8px;left:-8px;width:24px;height:24px;padding:0;border-radius:50%;background:var(--er);color:#fff;font-size:.8rem;line-height:24px;box-shadow:var(--sh)}
.cc .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--wa)}
.cc.lifting{opacity:.25}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;box-shadow:var(--sh);transform:scale(1.06);margin:0!important}
.ph{border-left:5px solid var(--pc,var(--ac));padding-left:10px;margin-bottom:12px}
.phh{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.phh input{font-weight:800;max-width:11em}
.chip{display:inline-flex;align-items:center;gap:.35em;background:var(--sf2);border-radius:99px;padding:.35em .5em .35em .8em;font-weight:800;border-left:6px solid var(--pc,var(--ac));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;flex:0 0 auto}
.chip button{padding:.15em .45em;border-radius:99px;background:var(--sf3);font-size:.85rem}
.chip.lifting{opacity:.25}
/* ---- Listas verticales (canciones, shows) ---- */
.li{display:flex;align-items:center;gap:.6em;background:var(--sf2);border-radius:12px;padding:.55em .7em;margin-bottom:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y}
.li.lifting{opacity:.25}
.li .num{width:1.8em;text-align:right;color:var(--mu);font-weight:800}
.li.cur{outline:2px solid var(--ac)}
.li.sep{background:transparent;border:2px dashed var(--ln)}
.grip{color:var(--mu);font-size:1.1rem;cursor:grab;padding:0 .2em}
/* ---- Perillas ---- */
.knob{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:74px}
.knob svg{width:56px;height:56px;touch-action:pan-y;cursor:ew-resize}
.knob .kl{font-size:.75rem;color:var(--mu);font-weight:800;text-transform:uppercase;letter-spacing:.4px}
.knob input{width:68px;text-align:center;padding:.2em}
.knob.inh svg{opacity:.35}
.seg{display:inline-flex;background:var(--sf2);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;padding:.35em .7em;border-radius:8px;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--aci)}
.tg{display:inline-flex;align-items:center;gap:.5em;cursor:pointer;user-select:none}
.tg input{display:none}
.tg span.sw{width:42px;height:24px;border-radius:99px;background:var(--sf3);position:relative;transition:.15s;flex:0 0 auto}
.tg span.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.tg input:checked+span.sw{background:var(--ac)}
.tg input:checked+span.sw:after{left:21px}
/* ---- Piano ---- */
.piano{position:relative;height:96px;margin:6px 0;user-select:none;touch-action:pan-x}
.piano .w,.piano .b{position:absolute;border-radius:0 0 6px 6px;cursor:pointer}
.piano .w{top:0;height:96px;background:#f4f7f8;border:1px solid #9fb1b8}
.piano .b{top:0;height:58px;background:#1c262c;z-index:2}
.piano .on{background:var(--ac)!important}
.piano .lbl{position:absolute;bottom:3px;width:100%;text-align:center;font-size:.6rem;color:#6b8089;pointer-events:none}
/* ---- Modal y toast ---- */
.sndmenu{position:fixed;z-index:55;background:var(--sf);border-radius:14px;box-shadow:var(--sh);padding:6px;display:flex;flex-direction:column;gap:2px;min-width:14em}
.sndmenu button{background:transparent;text-align:left;font-weight:700}
.sndmenu button.on{background:var(--ac);color:var(--aci)}
#btnSnd,#btnCloud{display:inline-flex;align-items:center;padding:.35em .5em}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--sf);border-radius:18px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--sf3);color:var(--tx);padding:.7em 1.1em;border-radius:12px;font-weight:800;z-index:60;box-shadow:var(--sh);max-width:90vw}
.mem{height:10px;background:var(--sf2);border-radius:99px;overflow:hidden}.mem i{display:block;height:100%;background:var(--ac)}
table.tr{width:100%;border-collapse:collapse}table.tr td{padding:4px}
/* ---- Modo Performance ---- */
.perf{position:fixed;inset:0;z-index:40;background:#0a0e10;color:#eef6f8;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
:root[data-theme=light] .perf{background:#0a0e10;color:#eef6f8}
.pf-top{display:flex;align-items:center;gap:.6em}
.pf-top .t{font-weight:900;font-size:1.25rem}
.pf-top button{background:#1d272d;color:#eef6f8}
.pulse{width:16px;height:16px;border-radius:50%;background:#25343c}
.pulse.b{background:var(--ac);box-shadow:0 0 14px var(--ac)}
.pulse.b1{background:#fff;box-shadow:0 0 18px #fff}
.tele{flex:1;display:grid;grid-template-columns:1fr 2.2fr 1fr;align-items:center;text-align:center;gap:8px;min-height:0}
.tele .prev,.tele .next{opacity:.38;font-weight:900;font-size:clamp(1.6rem,6vw,3.6rem)}
.tele .next{opacity:.7}
.tele .cur{font-weight:900;font-size:clamp(3.6rem,17vw,11rem);line-height:1;color:var(--ac)}
.tele .cur.sil{color:#5b6b73}
.tele .ly{font-size:clamp(1rem,3vw,1.7rem);color:#cfe0e6;margin-top:.3em;font-weight:700}
.tele .lyn{font-size:clamp(.8rem,2vw,1.1rem);color:#7f959e;margin-top:.3em}
.tele .ph{border:0;padding:0;margin:0;font-weight:800;color:#9fb4bd;font-size:1.05rem}
.fstrip{display:flex;gap:4px;height:46px;margin-top:8px}
.fstrip div{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#081418;cursor:pointer;overflow:hidden;white-space:nowrap;position:relative;min-width:0}
.fstrip div.dim{opacity:.35}
.fstrip div .mk{position:absolute;bottom:0;height:5px;background:#fff}
.map{flex:1;overflow:auto;padding-top:8px}
.map .mr{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
.map .ml{flex:0 0 7.5em;border-radius:10px;padding:.4em .6em;font-weight:900;color:#081418;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.map .ml small{font-weight:800;opacity:.75}
.map .mc{flex:1 1 0;min-width:3.2em;max-width:8em;background:#172127;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:clamp(1rem,2.6vw,1.6rem);padding:.3em}
.map .mc small{font-size:.65rem;font-weight:700;color:#8aa0ab;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map .mc.now{background:var(--ac);color:#062b33}
.map .mc.now small{color:#0b3f4a}
.map .mc.done{opacity:.45}
.pf-bot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pf-bot .nx{flex:1;color:#9fb4bd;font-weight:800;min-width:10em}
.pf-bot .nx b{color:#eef6f8}
.pf-bot button{background:#1d272d;color:#eef6f8;padding:.8em 1.1em}
.pf-bot button.mute{background:var(--er);color:#fff}
.lockov{position:absolute;inset:0;z-index:5}
.lockbtn{position:relative;z-index:6}
.scene{background:#2a2410;color:#ffd98a;border-radius:10px;padding:.5em .8em;font-weight:800;margin-top:6px}
@media (max-width:640px){.tele{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}.tele .prev{display:none}.bigbtns{grid-template-columns:1fr 1fr}.hide-sm{display:none}}
@media print{.hdr,.tabs,.toast{display:none}}
/* ===================== Look Quack ===================== */
button{background:var(--sf);border:1px solid var(--ln);color:var(--tx2);border-radius:12px;font-weight:800}
button:hover{filter:none;background:var(--sf2)}
button.ac{background:var(--ac);border-color:var(--ac);color:var(--aci)}button.ac:hover{filter:brightness(.97);background:var(--ac)}
button.er{background:var(--er);border-color:var(--er);color:#fff}button.er:hover{background:var(--er);filter:brightness(.97)}
button.gh{background:transparent;border-color:transparent}
button{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--sf);border:1px solid var(--ln);color:var(--tx)}
h2{color:var(--tx)}h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mu)}
.hdr{background:var(--bar);color:#fff;border-bottom:0;padding:.55em max(12px,env(safe-area-inset-left));gap:.5em}
.brand{font-size:1.35rem;font-weight:800;color:#fff}.brand b{color:#fff;font-weight:800}
.brand .duck{width:34px;height:34px;color:#fff}
.hdr button.gh{color:#fff;border-radius:10px}.hdr button.gh:hover{background:#ffffff26}
.pill{background:#ffffff2e;color:#fff}.pill i{background:#fff}.pill.un i{background:#FFE08A}.pill.er i{background:#FFB3A8}.pill.off i{background:#ffffff80}
.tabs{background:var(--bg);border-bottom:1px solid var(--ln);padding:0 12px;gap:2px;top:54px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:.8em .9em .6em;color:var(--mu);background:transparent}
.tabs button:hover{background:transparent;color:var(--tx2)}
.tabs button.on{background:transparent;color:var(--ack);border-bottom-color:var(--ac)}
main{padding:14px 16px}
.card{border:1px solid var(--ln);box-shadow:none;padding:16px}
.banner{background:#FFF1DC;color:#7A4A00;border:1px solid #F6D9A8}.banner button{background:#fff}
:root[data-theme=dark] .banner{background:#3A2E1A;color:#F6D9A8;border-color:#5A4424}
.banner.er{background:#FDE3DF;color:#8A2A1E;border-color:#F3B9B0}
.live-chord{color:var(--ack)}
.bigbtns button{padding:.9em;font-size:1rem}
.li{background:var(--sf);border:1px solid var(--ln)}
.li.cur{outline:0;box-shadow:inset 4px 0 0 var(--ac)}.li.cur .grow b,.li.cur .grow{color:var(--ack)}
.li.sep{background:transparent;border:2px dashed var(--ln)}
.cc{background-color:var(--sheet);background-image:repeating-linear-gradient(to bottom,transparent 0 21px,var(--sheetln) 21px 22px);background-position:0 9px;border:0;border-radius:10px;padding:.55em .75em .45em;color:var(--tx)}
.cc.sel{outline:3px solid var(--ac);outline-offset:1px}
.cc.msel{outline:3px dashed var(--wa);outline-offset:1px}
.cc .dot{background:var(--ac)}
.cc .del{background:var(--er);border:0;color:#fff;box-shadow:none}
.chip{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--pc,var(--ac))}
.chip button{background:var(--sf2);border:0}
.seg{background:var(--bg);border:1px solid var(--ln)}
.seg button{border:0;background:transparent;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--aci)}
.tg span.sw{background:var(--sf3)}
.knob input{background:var(--bg)}
.piano .w{background:#fff;border:1px solid #CFC8C1}.piano .b{background:#3A3633}.piano .lbl{color:#9A948E}
.sndmenu{background:var(--sf);border:1px solid var(--ln)}
.sndmenu button{border:0}
.modal .box{background:var(--sf);border:1px solid var(--ln)}
.toast{background:#333;color:#fff}
.mem{background:var(--sf2)}
.cloudbadge{position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;border:2px solid var(--bar)}
#btnCloud{position:relative}
/* Modo Performance: siempre oscuro, carbón cálido */
.perf{background:#141312;color:#F2EFEB}:root[data-theme=light] .perf{background:#141312;color:#F2EFEB}
.pf-top button,.pf-bot button{background:#262422;border:1px solid #35322F;color:#F2EFEB}
.pf-bot button.mute{background:var(--er);border-color:var(--er)}
.map .mc{background:#221F1D}.tele .ph,.pf-bot .nx{color:#A8A29C}
.pf-top .duck{width:28px;height:28px;color:var(--ac)}
/* Barra de Android (hora, WiFi…): calipso. Lo que queda detrás de esa barra es el fondo de <html>;
   si la app se dibuja de borde a borde, la franja calipso se extiende hasta arriba (zona segura). */
html{background:var(--bar)}
body{background:var(--bg)}
.hdr{padding-top:calc(.55em + env(safe-area-inset-top,0px))}
.tabs{top:calc(54px + env(safe-area-inset-top,0px))}
/* Filas de ajustes: etiqueta arriba (mismo estilo y altura), control debajo, todo alineado arriba */
.row.fields{align-items:flex-start;gap:18px 22px}
.row.fields>.col,.row.fields>.knob{gap:6px}
.row.fields>.col>span.mu.sm:first-child,.knob .kl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);line-height:1.2;min-height:1.2em}
.row.fields .knob{align-items:center}
/* Frases como tarjetas de color */
.pt{position:relative;flex:0 0 auto;min-width:120px;max-width:200px;border-radius:12px;padding:10px 12px 10px 16px;background:var(--sf);border:1px solid var(--ln);cursor:pointer;
  box-shadow:inset 6px 0 0 var(--pc);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y;display:flex;flex-direction:column;gap:2px}
.pt b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}.pt small{color:var(--mu);font-weight:700;font-size:.78rem}
.pt.on{outline:3px solid var(--ac);outline-offset:1px;background:color-mix(in srgb,var(--pc) 14%,var(--sf))}
.pt.add{box-shadow:none;border-style:dashed;align-items:center;justify-content:center;flex-direction:row;gap:6px;color:var(--tx2);min-width:96px}
.pt.add b{padding:0}
.pt.lifting{opacity:.25}
.pt .ptm{position:absolute;top:6px;right:6px;width:28px;height:28px;padding:0;border-radius:8px;background:var(--sf)}
#chordsCard{box-shadow:inset 6px 0 0 var(--pc)}
.cc .del{top:4px;right:4px;left:auto;width:22px;height:22px;padding:0;border-radius:50%}
.cc .del .ic{width:13px;height:13px;stroke-width:3}
.cc .dot{left:6px;right:auto}
.strip{padding-top:6px}
.sndmenu button .ic{width:18px;height:18px;margin-right:4px}.sndmenu button.delm{color:var(--er)}
/* Barra fija arriba mientras se edita un acorde */
.stick{position:fixed;left:0;right:0;z-index:18;background:var(--sf);border-bottom:1px solid var(--ln);box-shadow:0 6px 16px #0000001a;display:flex;align-items:center;gap:8px;padding:6px 12px}
.stick select{font-weight:800;max-width:10em}
.stick .dotc{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.sc2w{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1}
.sc2{flex:0 0 auto;padding:.35em .7em;border-radius:8px;background:var(--sheet);border:0;color:var(--tx);font-weight:800}
.sc2.on{background:var(--ac);color:var(--aci)}
/* Grupos desplegables: un botón con título y resumen; al tocarlo se abren sus opciones */
.sec{border:1px solid var(--ln);border-radius:12px;background:var(--sf);margin-top:10px;overflow:hidden}
.sec>button.sech{width:100%;border:0;border-radius:0;background:transparent;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;color:var(--tx)}
.sec>button.sech:hover{background:var(--sf2)}
.sech .ic{width:22px;height:22px;color:var(--ack)}
.sech .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.sech .tt b{font-size:1rem;font-weight:800}
.sech .tt small{font-weight:700;color:var(--mu);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sech .chev{transition:transform .15s;color:var(--mu)}
.sec.open>button.sech .chev{transform:rotate(90deg)}
.sec.open>button.sech{border-bottom:1px solid var(--ln)}
.secb{padding:4px 14px 12px}
.srow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.srow .sl{flex:1 1 16em;min-width:12em}
.srow .sl b{display:block;font-weight:800;color:var(--tx)}
.srow .sl small{display:block;color:var(--mu);font-size:.82rem;line-height:1.35;margin-top:2px}
.srow .sc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.srow .sc .knob .kl{display:none}
.srow .own{flex-basis:100%;display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}
/* Al entrar, al pato de la barra le bajan los anteojos "like a boss"; después se los saca */
.hduck{position:relative;display:inline-block;width:34px;height:34px;flex:0 0 auto}
.hduck .duck{position:absolute;inset:0;width:34px;height:34px}
.hduck .glasses{opacity:0;transform-origin:75% 22%;pointer-events:none}
.hduck.boss .glasses{animation:boss 3.6s both}
@keyframes boss{
  0%{transform:translate(-4%,-110%) rotate(-16deg);opacity:0;animation-timing-function:cubic-bezier(.25,.9,.3,1.3)}
  6%{opacity:1}
  22%{transform:none;opacity:1}
  84%{transform:none;opacity:1;animation-timing-function:ease-in}
  100%{transform:translate(0,-120%) rotate(8deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.hduck.boss .glasses{animation:none}}
/* (antes: pantalla de inicio propia; se quitó porque Android ya muestra la suya) */
.splash{position:fixed;inset:0;z-index:100;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#4EC6DF;transition:opacity .35s}
.splash .duck{width:178px;height:178px}.splash b{font-size:1.6rem;font-weight:800}
.spduck{position:relative;width:178px;height:178px}.spduck .duck{position:absolute;inset:0}
/* Igual a la pantalla de carga de Android (fondo blanco, pato con anteojos): parece una sola.
   Los anteojos hacen un destello de luz antes de entrar a la app. */
.spduck .sweep{transform:translateX(0);animation:sweep .7s ease-in-out .25s both}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(150px)}}
.splash.out{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.splash{transition:none}.spduck .sweep{animation:none;opacity:0}}
/* ===== Herramientas dentro de cada panel, todo en calipso ===== */
:root{--acl:color-mix(in srgb,var(--ac) 16%,var(--sf));--acl2:color-mix(in srgb,var(--ac) 30%,var(--sf))}
/* Franja calipso + pestañas + barra fija: un solo bloque arriba; el contenido empieza debajo (no queda tapado) */
.topw{position:sticky;top:0;z-index:20;background:var(--bg)}
html,body{overflow-anchor:none}
.topw .hdr,.topw .tabs{position:static}
.htools{display:flex;gap:2px}
.htools button{padding:.4em .5em}.htools .ic{width:22px;height:22px}
.htools button:disabled{opacity:.35}
@media (max-width:560px){.brand>span:last-child{display:none}.hdr{gap:.25em}}
/* Sin botones rojos: "borrar" y "silenciar" son botones calipso con borde */
button.er,button.er:hover,.pf-bot button.mute{background:var(--sf);color:var(--ack);border:1px solid var(--ac)}
.sndmenu button.delm{color:var(--tx)}
/* Encabezado de panel: título, qué está elegido y sus herramientas */
.pnh{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin-bottom:8px}
.pnh h2{margin:0}
.pnh .tgt{font-weight:800;color:var(--ack);background:var(--acl);border-radius:99px;padding:.15em .7em;font-size:.85rem;white-space:nowrap;max-width:12em;overflow:hidden;text-overflow:ellipsis}
.pnh .tgt i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.tools{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;align-items:center}
.tools button,.tools select{background:var(--acl);color:var(--ack);border:0;padding:.4em .6em;font-size:.85rem;font-weight:800;border-radius:9px}
.tools select{appearance:auto;max-width:9em}
.tools button .ic{width:17px;height:17px}
@media (max-width:560px){.tools button,.tools select{padding:.35em .5em;font-size:.8rem}.tools{gap:3px}}
.tools button.on{background:var(--ac);color:var(--aci)}
.tools .cnt{font-weight:900;color:var(--ack);min-width:2em;text-align:center}
.tools .sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--sf)}
.pnh+.hint{margin:-4px 0 8px}
/* Tarjetas (frases, pasos, acordes): calipso claro; la elegida, calipso fuerte */
.pt{background:var(--acl);border-color:transparent}
.pt.on{background:var(--ac);color:var(--aci);outline:0}
.pt.on small{color:#ffffffd0}
.chip{background:var(--acl);border:0;border-left:6px solid var(--pc,var(--ac));cursor:pointer;padding:.45em .8em}
.chip.on{background:var(--ac);color:var(--aci)}
.chip b{font-weight:900;opacity:.75}
.cc{background:var(--acl);background-image:none;outline:0;color:var(--tx)}
.cc .nt{color:var(--tx2)}
.cc.sel{background:var(--ac);color:var(--aci);outline:0}
.cc.sel .nt,.cc.sel.sil .nm{color:#ffffffd8}
.cc.msel{outline:3px dashed var(--ack);outline-offset:1px}
.cc.sel .dot{background:#fff}
/* ✕ montada sobre la esquina de la tarjeta, sin cortarse */
.strip{padding:14px 14px 10px 4px}
.cc .del{top:-10px;right:-10px;width:26px;height:26px;background:var(--ac);color:#fff;border:2px solid var(--sf);z-index:2}
.cc .del .ic{width:13px;height:13px}
/* Combinator: los acordes van dentro del panel de frases */
.rack{margin-top:6px;border-radius:12px;background:var(--bg);border:1px solid var(--ln);box-shadow:inset 6px 0 0 var(--pc);padding:12px 12px 4px 18px}
.rack .pnh h2{font-size:1rem}
#chordsCard{box-shadow:inset 6px 0 0 var(--pc)}
/* Barra fija: calipso */
.stick select{background:var(--sf);color:var(--ack);border:0}
.sc2{background:var(--sf);color:var(--ack)}
.sc2.on{background:var(--ac);color:var(--aci)}
/* Velocity por nota, bajo el piano */
.vlane{position:relative;height:84px;margin:0 0 6px}
.vb{position:absolute;top:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:30px}
.vn{font-size:.74rem;font-weight:900;color:var(--mu);cursor:text;line-height:1.2}
.vb.own .vn{color:var(--ack)}
.vt{flex:1;width:18px;background:var(--sf2);border-radius:6px;position:relative;touch-action:none;cursor:ns-resize;overflow:hidden}
.vt i{position:absolute;left:0;right:0;bottom:0;background:var(--acl2)}
.vb.own .vt i{background:var(--ac)}
.vb small{font-size:.6rem;color:var(--mu);white-space:nowrap}
.vin{width:3.4em;padding:.1em .2em;font-size:.8rem;text-align:center}
/* Transición propia de una perilla y avisos del acorde */
.ctlt{flex-basis:100%;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln)}
.ctlt small{font-size:.8rem}
.cgraph{width:170px;height:54px;background:var(--acl);border-radius:8px}
.cgraph path{fill:none;stroke:var(--ack);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cgraph text{font-size:8.5px;font-weight:800;fill:var(--ack)}
.warnb{display:flex;gap:10px;align-items:flex-start;background:var(--acl);color:var(--tx);border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.warnb>.ic{color:var(--ack);margin-top:2px}.warnb small{display:block;color:var(--tx2);font-size:.85rem}
.warnb button{background:var(--sf);color:var(--ack);border:1px solid var(--ac);font-size:.85rem}
/* Paletitas y menús emergentes */
.pop{position:fixed;z-index:55;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--sh);padding:10px}
.pal{display:grid;grid-template-columns:repeat(4,36px);gap:8px}
.pal button{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid transparent}
.pal button.on{border-color:var(--tx)}
.pop .col{gap:8px}
.pop select{width:100%}
</style>
</head>

<script>
"use strict";
/* =====================================================================
   Quack MIDI — interfaz web. Todo el modelo vive aquí (en el navegador);
   el Arduino solo guarda el "blob" binario y lo usa para tocar.
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else if(k==='checked')e.checked=!!v;else e.setAttribute(k,v===true?'':v);}for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const copy=o=>JSON.parse(JSON.stringify(o));
const PCOL=['#4EC6DF','#ffb84d','#ff8a7a','#b39dff','#5bd6a0','#ff9fd0','#7fa8ff','#d4e157'];

/* ---------- Íconos dibujados (línea redondeada, estilo Quack Notes) ---------- */
const ICONS={
  undo:'<path d="M8 5l-4 4 4 4"/><path d="M4 9h9a6 6 0 0 1 0 12h-2"/>',
  redo:'<path d="M16 5l4 4-4 4"/><path d="M20 9h-9a6 6 0 0 0 0 12h2"/>',
  play:'<path d="M8 5.5v13l10.5-6.5z"/>', stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>',
  check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l3 3 5-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  copy:'<rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>',
  paste:'<rect x="6" y="5" width="12" height="15" rx="2"/><path d="M9.5 5V3.8h5V5"/><path d="M9 11h6M9 15h4"/>',
  dup:'<rect x="4" y="4" width="11" height="11" rx="2"/><path d="M9 20h9a2 2 0 0 0 2-2V9"/><path d="M9.5 9.5h0"/>',

const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const TYPES=[['',[0,4,7],'Mayor'],['m',[0,3,7],'menor'],['7',[0,4,7,10],'7'],['maj7',[0,4,7,11],'maj7'],['m7',[0,3,7,10],'m7'],['6',[0,4,7,9],'6'],['m6',[0,3,7,9],'m6'],['9',[0,4,7,10,14],'9'],['m9',[0,3,7,10,14],'m9'],['add9',[0,4,7,14],'add9'],['sus2',[0,2,7],'sus2'],['sus4',[0,5,7],'sus4'],['7sus4',[0,5,7,10],'7sus4'],['dim',[0,3,6],'dim'],['dim7',[0,3,6,9],'dim7'],['m7b5',[0,3,6,10],'m7♭5'],['aug',[0,4,8],'aug'],['mMaj7',[0,3,7,11],'m(maj7)'],['5',[0,7],'5 (power)']];

function stepLabel(c,tr=0){if(c.trans===2)return '↗ '+((c.bend||0)>0?'+':'')+(c.bend||0);return chordName(c.notes,tr);}
function chordName(notes,tr=0){
  if(!notes.length)return '—';
  const ns=notes.map(n=>n+tr).sort((a,b)=>a-b),bass=ns[0]%12,pcs=[...new Set(ns.map(n=>n%12))];
  let best=null;
  for(const [suf,iv] of TYPES){const set=[...new Set(iv.map(i=>i%12))];if(set.length!==pcs.length)continue;
    for(const r of pcs){if(set.every(i=>pcs.includes((r+i)%12))){const sc=(r===bass?0:1)+set.length*0;if(!best||sc<best.sc)best={sc,name:NN[r]+suf+(r!==bass?'/'+NN[bass]:'')};}}}
  return best?best.name:ns.map(n=>NN[n%12]).join('·');
}
function buildChord(root,oct,ti,inv){let ns=TYPES[ti][1].map(i=>12*(oct+1)+root+i);for(let k=0;k<inv;k++){ns.sort((a,b)=>a-b);ns.push(ns.shift()+12);}return ns.map(n=>clamp(n,0,127)).sort((a,b)=>a-b).slice(0,7);}

const CTRL=[['Modulación',1,true,0],['Filtro (frecuencia)',74,true,64],['Resonancia',71,true,0],['Drive',63,true,0],['Ataque',73,false,0],['Decay',75,false,64],['Sustain',70,false,127],['Release',72,false,20]];

    if(tm){const q=tm.b?4:10;v.push(id|0x80|(tm.b?0x40:0),d.ctl[id]&127,Math.min(255,Math.round((tm.d||0)*q)),Math.min(255,Math.round((tm.w||0)*q)));}   // transición propia: espera y duración

    for(const p of s.phrases){str(p.name,16);u8((p.color&7)|(p.sound?128:0));if(p.sound){u8(p.sound.bank&3);u8(p.sound.pc&127);}u8(p.chords.length);for(const c of p.chords){const ns=[...c.notes].sort((a,b)=>a-b).slice(0,7);const hh=c.hold!=null,ht=c.tie!=null,hb=c.bpm!=null,hv=c.vel!=null;
      const cx=packX(c,CX,ns);u8(ns.length|(hh?8:0)|(ht?16:0)|(hb?32:0)|(hv?64:0)|(cx.length?128:0));if(hh||ht)u8((c.hold?1:0)|(c.tie?2:0));if(hb)u16(c.bpm);if(hv)u8(c.vel);for(const x of cx)u8(x);for(const n of ns)u8(n);}}
    u8(s.form.length);for(const f of s.form){u8(f.p);u8(f.r);}}
  u8(m.sets.length);for(const st of m.sets){str(st.name,24);u8(st.entries.length);for(const e of st.entries){u8(e.k);if(e.k===0){u8(e.s);u8(e.t&255);str(e.note||'',40);}else str(e.label||'',24);}}

function dec(b){let i=0;const unpackX=(d,keys,nn=0)=>{const f=u8();keys.forEach((k,j)=>{if(f&(1<<j)){let v=u8();if(k==='glide')v*=10;if(k==='bend'&&v>127)v-=256;d[k]=v;}});
    if(f&16){d.ctl={};for(let n=u8();n--;){const b=u8(),id=b&7;d.ctl[id]=u8();if(b&0x80){const q=b&0x40?4:10,du=u8(),w=u8();d.ctlT=d.ctlT||{};d.ctlT[id]={w:w/q,d:du/q,b:!!(b&0x40)};}}}
    if(f&32){d.nv=[];for(let n=nn;n--;){let x=u8();if(x>127)x-=256;d.nv.push(x);}}
    if(d.mod!=null){d.ctl=d.ctl||{};d.ctl[0]=d.mod;delete d.mod;}};   // la antigua "mod" pasa a ser el control Modulación
  const u8=()=>{if(i>=b.length)throw Error('corto');return b[i++]},u16=()=>u8()|u8()<<8,str=()=>{const n=u8();const s=td.decode(b.subarray(i,i+n));i+=n;return s};
  const S={outCh:u8(),clock:!!(u8()&1),longMs:u8()*10,trig:[0,1,2,3].map(()=>({t:u8(),ch:u8(),n:u8()}))};S.ssid=str();S.pass=str();S.nextId=u16();
  const songs=[];for(let k=u8();k--;){const s={id:u16(),name:str()};const f=u8();Object.assign(s,{hold:!!(f&1),tie:!!(f&2),repeat:!!(f&4),sendPC:!!(f&8),bank:(f>>4)&3,bpm:u16(),vel:u8(),pc:u8(),phrases:[]});if(f&64)unpackX(s,SX);
    for(let p=u8();p--;){const ph={name:str(),color:u8(),chords:[]};if(ph.color&128){ph.color&=7;ph.sound={bank:u8(),pc:u8()};}for(let c=u8();c--;){const hd=u8(),ch={};if(hd&24){const ov=u8();if(hd&8)ch.hold=!!(ov&1);if(hd&16)ch.tie=!!(ov&2);}if(hd&32)ch.bpm=u16();if(hd&64)ch.vel=u8();if(hd&128)unpackX(ch,CX,hd&7);ch.notes=[];for(let n=hd&7;n--;)ch.notes.push(u8());if(ch.nv){const o={};ch.notes.forEach((n,k)=>{if(ch.nv[k])o[n]=ch.nv[k];});ch.nv=o;if(!Object.keys(o).length)delete ch.nv;}ph.chords.push(ch);}s.phrases.push(ph);}
    s.form=[];for(let n=u8();n--;)s.form.push({p:u8(),r:u8()});songs.push(s);}
  const sets=[];for(let k=u8();k--;){const st={name:str(),entries:[]};for(let n=u8();n--;){const kd=u8();if(kd===0){const s=u8();let t=u8();if(t>127)t-=256;st.entries.push({k:0,s,t,note:str()});}else st.entries.push({k:1,label:str()});}sets.push(st);}
  if(i!==b.length)throw Error('sobran bytes');return{settings:S,songs,sets};}

/* ---------- Sonido en este dispositivo (sintetizador muy simple) ----------
   prefs.sound: false = apagado · 'fade' = corto (se apaga solo en ~2 s) · 'latch' = sostenido
   hasta el siguiente acorde. Con Ligado, las notas repetidas siguen sonando sin re-atacarse. */
let actx=null;let voices=[];   // {note,o,g,until}
const sndOn=()=>prefs.sound==='fade'||prefs.sound==='latch';
const localSound=sndOn;
const hz=n=>440*Math.pow(2,(n-69)/12);
function relVoice(v,t){try{v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.linearRampToValueAtTime(0,t+.08);v.o.stop(t+.1);}catch(e){}}
function synthStop(){if(!actx)return;const t=actx.currentTime;for(const v of voices)relVoice(v,t);voices=[];}
// En modo "Corto" cada voz se apaga sola ~2,6 s después de su último ataque
setInterval(()=>{const now=Date.now();voices=voices.filter(v=>{if(v.until&&now>v.until){try{v.o.stop();}catch(e){}return false;}return true;});},300);
function envAttack(g,t,lvl){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(lvl,t+.02);
  if(prefs.sound==='fade')g.gain.setTargetAtTime(0,t+.05,.45);else g.gain.setTargetAtTime(lvl*.6,t+.05,.2);}
function newVoice(n,t,lvl){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=hz(n);g.gain.setValueAtTime(0,t);
  o.connect(g).connect(actx.destination);o.start(t);envAttack(g,t,lvl);return{note:n,o,g,until:prefs.sound==='fade'?Date.now()+2600:0};}
function glideTo(v,freq,t,ms){v.o.frequency.cancelScheduledValues(t);v.o.frequency.setValueAtTime(v.o.frequency.value,t);
  if(ms>0)v.o.frequency.exponentialRampToValueAtTime(freq,t+ms/1000);else v.o.frequency.setValueAtTime(freq,t);}
/* Tocar un paso. opt: {tie, trans (0 normal, 1 legato, 2 pitch bend), glide (ms), bend (semitonos)} */
function synthPlay(notes,vel=100,opt={}){if(!sndOn())return;
  if(typeof opt==='boolean')opt={tie:opt};
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){return;}
  const t=actx.currentTime,ms=opt.glide!=null?opt.glide:150;
  if(opt.trans===2){for(const v of voices)glideTo(v,hz(v.note+(opt.bend||0)),t,ms);return;}   // pitch bend: mismas notas, se mueve la altura
  for(const v of voices)glideTo(v,hz(v.note),t,0);                                            // la rueda vuelve al centro
  const nv=opt.nv||{},lv=n=>.22*clamp(vel+(nv[n]||0),1,127)/127/Math.sqrt(Math.max(1,notes.length)),ns=[...notes].sort((a,b)=>a-b);
  if(opt.trans===1&&voices.length){                                                             // legato: cada voz desliza a una nota nueva
    const old=[...voices].sort((a,b)=>a.note-b.note),keep=[];
    ns.forEach((n,i)=>{const v=old[i];if(v){glideTo(v,hz(n),t,ms);v.note=n;if(prefs.sound==='fade'){envAttack(v.g,t,lv(n));v.until=Date.now()+2600;}keep.push(v);}else keep.push(newVoice(n,t,lv(n)));});
    for(const v of old.slice(ns.length))relVoice(v,t);
    voices=keep;return;}
  const keepN=new Set(opt.tie?ns:[]);
  voices=voices.filter(v=>{if(keepN.has(v.note))return true;relVoice(v,t);return false;});
  for(const n of ns)if(!voices.some(v=>v.note===n))voices.push(newVoice(n,t,lv(n)));}

    if(j.ok){pendingUp=false;lastErr='';knownBv=j.bv;upRetry=0;}else{lastErr=j.e||'El Arduino rechazó los datos';if(upRetry++<3)upTimer=setTimeout(upload,1500);else toast(lastErr);}}

    if(M&&s.cn!==oldCn&&oldCn!=null&&s.cv)onCapture(s.cv,s.cw);

    if(M&&localSound()&&pos!==lastPos){lastPos=pos;const so=M.songs[s.s];let it=null;
      if(so&&s.c>=0)it=flatten(so).find(x=>x.st===s.st&&x.r===s.r&&x.ci===s.c);
      if(it){const same=lastIt&&lastSongIdx===s.s,c=it.c,tie=same?(lastIt.c.tie!=null?lastIt.c.tie:so.tie):false,tr=liveTr();
        const trans=same?(c.trans!=null?c.trans:(so.trans||0)):0;

/* Perilla: se gira arrastrando hacia arriba/abajo, o se escribe el número. */
function knob({label,value,min,max,step=1,onInput,inherit=false}){
  const R=22,C=28,A0=135,A1=405;const pol=(a)=>{const r=a*Math.PI/180;return[C+R*Math.cos(r),C+R*Math.sin(r)];};
  const arc=(a0,a1)=>{const[x0,y0]=pol(a0),[x1,y1]=pol(a1);return`M${x0} ${y0}A${R} ${R} 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`;};
  const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 56 56');
  const bg=document.createElementNS(ns,'path');bg.setAttribute('d',arc(A0,A1));bg.setAttribute('stroke','var(--sf3)');bg.setAttribute('stroke-width','6');bg.setAttribute('fill','none');bg.setAttribute('stroke-linecap','round');
  const fg=bg.cloneNode();fg.setAttribute('stroke','var(--ac)');svg.append(bg,fg);
  const inp=h('input',{type:'number',min,max,step,value});
  const w=h('div',{class:'knob'+(inherit?' inh':'')},h('div',{class:'kl'},label),svg,inp);
  let v=value;const draw=()=>{const f=(v-min)/(max-min);fg.setAttribute('d',arc(A0,A0+Math.max(.5,f*(A1-A0))));};draw();
  const dec=(String(step).split('.')[1]||'').length;const set=(nv,fire)=>{nv=+clamp(Math.round(nv/step)*step,min,max).toFixed(dec);if(nv===v&&!fire)return;v=nv;inp.value=v;draw();w.classList.remove('inh');if(fire)onInput(v);};
  // Se gira arrastrando hacia los LADOS (izquierda = menos, derecha = más). El scroll vertical pasa de largo,
  // así no se cambia un valor sin querer al recorrer la página en la tablet.
  let sx=0,sy=0,sv=0,down=false,drag=false;
  svg.addEventListener('pointerdown',e=>{down=true;drag=false;sx=e.clientX;sy=e.clientY;sv=v;});
  svg.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!drag){if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){drag=true;try{svg.setPointerCapture(e.pointerId);}catch(_){}}else if(Math.abs(dy)>10){down=false;}return;}
    e.preventDefault();set(sv+dx*(max-min)/(e.shiftKey?600:220),false);});
  svg.addEventListener('pointerup',()=>{if(drag&&v!==sv)onInput(v);down=drag=false;});
  svg.addEventListener('pointercancel',()=>{if(drag)set(sv,false);down=drag=false;});
  svg.addEventListener('wheel',e=>{e.preventDefault();set(v+(e.deltaY<0?step:-step),true);},{passive:false});
  inp.addEventListener('change',()=>set(+inp.value,true));
  return w;}

function sortable(box,onMove,axis='x'){box.addEventListener('pointerdown',e=>{

  if(e.target.closest('input,select,textarea,button,.nodrag'))return;
  const s={box,it,onMove,axis,x:e.clientX,y:e.clientY,t:null,live:false};
  s.t=setTimeout(()=>{if(dragS!==s)return;s.live=true;const r=it.getBoundingClientRect();const g=it.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.append(g);s.g=g;s.dx=s.x-r.left;s.dy=s.y-r.top;s.from=[...box.children].indexOf(it);it.classList.add('lifting');moveG(s.x,s.y);try{navigator.vibrate&&navigator.vibrate(12);}catch(_){} },380);

  moveG(e.clientX,e.clientY);const over=document.elementFromPoint(e.clientX,e.clientY);const o=over&&over.closest('[data-idx]');

const GCLIENT='324991662272-2m4hpscenm2uc77f7lro6b5qvkc8g1gm.apps.googleusercontent.com';

function trackChanges(){if(!window.APPMODE||!M)return;const m=syncMeta();if(!m.hash)return;const now=Date.now();
  m.t=m.t||{};m.deleted=m.deleted||{};const seen=new Set();
  for(const so of M.songs){seen.add(so.id);const hh=hash(so);if(m.hash[so.id]!==hh){m.hash[so.id]=hh;m.t[so.id]=now;delete m.deleted[so.id];}}
  for(const id of Object.keys(m.hash))if(!seen.has(+id)){m.deleted[id]=now;delete m.hash[id];delete m.t[id];}
  const oh=hash(M.songs.map(x=>x.id));if(m.orderHash!==oh){m.orderHash=oh;m.orderT=now;}
  const sh=hash(setsById());if(m.setsHash!==sh){m.setsHash=sh;m.setsT=now;}
  const gh=hash(M.settings);if(m.settingsHash!==gh){m.settingsHash=gh;m.settingsT=now;}

function initMeta(){const m=syncMeta();if(m.hash)return m;   // primera vez: lo que ya existe cuenta como "antiguo" (t=0)
  const n={hash:{},t:{},deleted:{},orderHash:hash(M.songs.map(x=>x.id)),orderT:0,setsHash:hash(setsById()),setsT:0,settingsHash:hash(M.settings),settingsT:0};

const sane=t=>Math.min(+t||0,Date.now()+3600e3);   // una hora del futuro nunca gana (lección de Quack Notes)

// --- Google: sesión y Drive ---
function loadGis(){return new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.onload=()=>ok();sc.onerror=()=>no(Error('sin internet'));document.head.append(sc);});}
function tokenOk(){const m=syncMeta();return m.token&&m.exp>Date.now()+60e3;}
function getToken(interactive){return new Promise(async(ok,no)=>{if(tokenOk())return ok(syncMeta().token);if(!interactive)return no(Error('login'));
  try{await loadGis();}catch(e){return no(e);}
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:GSCOPE,
    callback:r=>{if(r.error)return no(Error(r.error));const m=syncMeta();m.token=r.access_token;m.exp=Date.now()+(r.expires_in||3600)*1000;m.connected=true;setSyncMeta(m);ok(r.access_token);},
    error_callback:e=>no(Error(e&&e.type||'cancelado'))});
  const m=syncMeta();tokenClient.requestAccessToken({prompt:m.connected?'':'consent',login_hint:m.email||undefined});});}
async function gd(tok,url,opt={}){const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tok},opt.headers||{})}));
  if(r.status===401){const m=syncMeta();m.token=null;setSyncMeta(m);throw Error('login');}if(!r.ok)throw Error('Drive '+r.status);return r;}
async function driveFile(tok){const m=syncMeta();if(m.fileId)return m.fileId;
  const q=encodeURIComponent("name='QuackMIDI.json' and trashed=false");
  const l=await (await gd(tok,`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`)).json();
  if(l.files&&l.files.length){m.fileId=l.files[0].id;setSyncMeta(m);return m.fileId;}
  const fq=encodeURIComponent("name='Quack MIDI' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const fl=await (await gd(tok,`https://www.googleapis.com/drive/v3/files?q=${fq}&fields=files(id)`)).json();
  let folder=fl.files&&fl.files[0]&&fl.files[0].id;
  if(!folder)folder=(await (await gd(tok,'https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Quack MIDI',mimeType:'application/vnd.google-apps.folder'})})).json()).id;
  const c=await (await gd(tok,'https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'QuackMIDI.json',mimeType:'application/json',parents:[folder]})})).json();
  m.fileId=c.id;setSyncMeta(m);return c.id;}

// --- Combinar lo local con lo del Drive ---
function mergeWith(R){const m=initMeta(),L={};M.songs.forEach(x=>L[x.id]=x);
  const Rs={};(R.songs||[]).forEach(x=>Rs[x.id]=x);const del=Object.assign({},R.deleted||{});
  for(const[k,v]of Object.entries(m.deleted||{}))del[k]=Math.max(sane(v),sane(del[k]));
  const out={},times={},conflicts=[];
  for(const id of new Set([...Object.keys(L),...Object.keys(Rs)].map(Number))){
    const l=L[id],r=Rs[id],tl=sane(m.t[id]),tr=r?sane(r._t):0;
    let win=l,t=tl;if(!l||(r&&tr>tl)){win=r;t=tr;}
    if(sane(del[id])>t)continue;                             // borrada después de su último cambio
    if(l&&r&&tl>(m.lastSync||0)&&tr>(m.lastSync||0)&&hash(l)!==hash(strip(r)))conflicts.push(win.name);
    out[id]=strip(win);times[id]=t;}
  const localOrder=sane(m.orderT)>=sane(R.orderT);
  const order=[...(localOrder?M.songs.map(x=>x.id):(R.order||[])),...(localOrder?(R.order||[]):M.songs.map(x=>x.id))];
  const songs=[...new Set(order)].filter(id=>out[id]).map(id=>out[id]);
  for(const id of Object.keys(out).map(Number))if(!songs.some(x=>x.id===id))songs.push(out[id]);
  const setsSrc=sane(m.setsT)>=sane(R.setsT)?setsById():(R.sets||[]);
  const idx=id=>songs.findIndex(x=>x.id===id);
  const sets=setsSrc.map(st=>({name:st.name,entries:st.entries.filter(e=>e.k!==0||idx(e.id)>=0).map(e=>e.k===0?{k:0,s:idx(e.id),t:e.t||0,note:e.note||''}:e)}));
  const settings=sane(m.settingsT)>=sane(R.settingsT)||!R.settings?M.settings:R.settings;
  return{model:{settings,songs,sets},times,deleted:del,conflicts,
    orderT:Math.max(sane(m.orderT),sane(R.orderT)),setsT:Math.max(sane(m.setsT),sane(R.setsT)),settingsT:Math.max(sane(m.settingsT),sane(R.settingsT))};}
const strip=x=>{const c=copy(x);delete c._t;return c;};

async function syncNow(interactive){if(!window.APPMODE||syncBusy||!M)return;
  if(!navigator.onLine){syncState='offline';syncMsg='Sin internet: se sincroniza cuando vuelva la conexión.';updCloud();return;}
  syncBusy=true;syncState='busy';updCloud();
  try{const tok=await getToken(interactive);const fid=await driveFile(tok);
    const txt=await (await gd(tok,`https://www.googleapis.com/drive/v3/files/${fid}?alt=media`)).text();
    let R={};try{R=txt?JSON.parse(txt):{};}catch(e){R={};}
    if(pendingUp||uploading)await upload();
    const mg=mergeWith(R);
    if(mg.conflicts.length)takeSnap(true);                                // guardar lo de antes por si acaso
    const changedHere=hash(mg.model.songs)!==hash(M.songs)||hash(mg.model.sets)!==hash(M.sets)||hash(mg.model.settings)!==hash(M.settings);
    // Actualizar lo local sin que cuente como edición nueva
    const m=syncMeta();m.hash={};m.t={};for(const so of mg.model.songs){m.hash[so.id]=hash(so);m.t[so.id]=mg.times[so.id]||0;}
    m.deleted=mg.deleted;m.orderT=mg.orderT;m.setsT=mg.setsT;m.settingsT=mg.settingsT;m.lastSync=Date.now();
    if(changedHere){snap();M=mg.model;fixSel();}

    if(changedHere){pendingUp=true;clearTimeout(upTimer);upTimer=setTimeout(upload,50);saveLyricsSoon();renderAll();}
    // Subir la versión combinada
    const body={app:'QuackMIDI',v:1,t:Date.now(),settings:M.settings,settingsT:m.settingsT,order:M.songs.map(x=>x.id),orderT:m.orderT,
      sets:setsById(),setsT:m.setsT,deleted:m.deleted,songs:M.songs.map(so=>Object.assign(copy(so),{_t:m.t[so.id]||0}))};
    await gd(tok,`https://www.googleapis.com/upload/drive/v3/files/${fid}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    syncState='ok';syncMsg='Sincronizado '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})+'.';
    if(mg.conflicts.length)toast('Se editó en dos lugares: '+mg.conflicts.join(', ')+'. Quedó lo más nuevo; lo anterior está en Copias automáticas.');
  }catch(e){const login=String(e.message)==='login';syncState=login?'login':'error';

<script>

(function(){
const DEMO=new Uint8Array([0, 1, 60, 0, 0, 80, 0, 0, 81, 0, 0, 82, 0, 0, 83, 10, 81, 117, 97, 99, 107, 32, 77, 73, 68, 73, 10, 113, 117, 97, 99, 107, 113, 117, 97, 99, 107, 5, 0, 4, 1, 0, 15, 68, 101, 109, 111, 58, 32, 73, 45, 86, 45, 118, 105, 45, 73, 86, 4, 100, 0, 100, 0, 1, 6, 86, 117, 101, 108, 116, 97, 0, 4, 3, 60, 64, 67, 3, 55, 59, 62, 3, 57, 60, 64, 3, 53, 57, 60, 1, 0, 1, 2, 0, 20, 68, 101, 109, 111, 58, 32, 69, 115, 116, 114, 111, 102, 97, 32, 121, 32, 99, 111, 114, 111, 0, 92, 0, 96, 0, 3, 7, 69, 115, 116, 114, 111, 102, 97, 0, 4, 3, 57, 60, 64, 3, 53, 57, 60, 3, 60, 64, 67, 3, 55, 59, 62, 4, 67, 111, 114, 111, 1, 4, 4, 53, 57, 60, 64, 3, 55, 59, 62, 3, 52, 55, 59, 12, 1, 57, 60, 64, 67, 5, 70, 105, 110, 97, 108, 2, 2, 4, 60, 64, 67, 71, 0, 5, 0, 2, 1, 1, 0, 1, 1, 2, 2, 1, 3, 0, 12, 68, 101, 109, 111, 58, 32, 76, 105, 103, 97, 100, 111, 2, 80, 0, 90, 0, 1, 5, 86, 111, 99, 101, 115, 3, 4, 4, 48, 55, 64, 71, 4, 48, 55, 64, 69, 4, 48, 55, 64, 67, 0, 1, 0, 1, 4, 0, 24, 68, 101, 109, 111, 58, 32, 77, 101, 108, 111, 100, 195, 173, 97, 32, 99, 111, 110, 32, 103, 108, 105, 100, 101, 64, 90, 0, 100, 0, 31, 1, 12, 1, 15, 2, 0, 0, 1, 60, 1, 8, 77, 101, 108, 111, 100, 195, 173, 97, 4, 6, 1, 67, 1, 69, 129, 2, 40, 72, 129, 23, 2, 80, 253, 2, 0, 64, 1, 110, 72, 129, 17, 0, 2, 0, 0, 1, 60, 67, 0, 1, 0, 1, 1, 14, 83, 104, 111, 119, 32, 100, 101, 32, 112, 114, 117, 101, 98, 97, 4, 0, 0, 0, 0, 1, 10, 73, 110, 116, 101, 114, 109, 101, 100, 105, 111, 0, 1, 2, 20, 80, 114, 101, 115, 101, 110, 116, 97, 114, 32, 97, 32, 108, 97, 32, 98, 97, 110, 100, 97, 0, 2, 0, 0]);
const LS='qm_app_v1';
let flash,blob;
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s){flash=new Uint8Array(s.f);blob=new Uint8Array(s.b);}}catch(e){}
if(!flash){flash=DEMO.slice();blob=DEMO.slice();}
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify({f:[...flash],b:[...blob]}));}catch(e){}};
const S={bv:1,s:0,st:0,r:0,c:-1,tr:0,set:255,se:0,thru:0,L:0,Lk:0,Lr:0,cap:0,cn:0,cv:[],warn:-1,t0:Date.now(),bpm:120};
let m=dec(blob);
const song=()=>m.songs[S.s];
const form=()=>{const s=song();return s.form.length?s.form:s.phrases.map((_,i)=>({p:i,r:1}));};
const nCh=st=>{const f=form()[st],p=song().phrases[f.p];return p?p.chords.length:0;};
function nextPos(st,r,c){const F=form();if(c+1<nCh(st))return[st,r,c+1];if(r+1<F[st].r)return[st,r+1,0];st++;while(st<F.length&&!nCh(st))st++;return st<F.length?[st,0,0]:null;}
function prevPos(st,r,c){const F=form();if(c>0)return[st,r,c-1];if(r>0)return[st,r-1,nCh(st)-1];st--;while(st>=0&&!nCh(st))st--;return st>=0?[st,F[st].r-1,nCh(st)-1]:null;}
function firstFrom(st){const F=form();while(st<F.length&&!nCh(st))st++;return st<F.length?[st,0,0]:null;}
function curChord(){const s=song();if(!s||S.c<0)return null;return s.phrases[form()[S.st].p].chords[S.c];}
function bpmNow(){const s=song();if(!s)return 120;const c=curChord();return c&&c.bpm!=null?c.bpm:s.bpm;}
function set(p){if(p){[S.st,S.r,S.c]=p;}}
function next(){const s=song();if(!s||!s.phrases.length)return;if(S.c<0)set(firstFrom(S.st));else{let p=nextPos(S.st,S.r,S.c);if(!p&&s.repeat)p=firstFrom(0);set(p);}}
function prev(){if(!song())return;if(S.c<0)set(firstFrom(S.st));else set(prevPos(S.st,S.r,S.c));}
function load(i,tr=0){if(!m.songs.length)return;S.s=Math.max(0,Math.min(i,m.songs.length-1));S.tr=tr;S.st=0;S.r=0;S.c=-1;}
function songStep(d){if(S.set<255&&m.sets[S.set]){const E=m.sets[S.set].entries;let i=S.se+d;while(i>=0&&i<E.length&&E[i].k!==0)i+=d;if(i>=0&&i<E.length){S.se=i;load(E[i].s,E[i].t);}}else load(S.s+d);}
function enterSet(i){if(!m.sets[i]){S.set=255;return;}S.set=i;const E=m.sets[i].entries;const j=E.findIndex(e=>e.k===0);if(j>=0){S.se=j;load(E[j].s,E[j].t);}}
function status(){const s=song();let end=0;if(s&&S.c>=0&&!s.repeat&&!nextPos(S.st,S.r,S.c))end=1;
  return{bv:S.bv,s:S.s,st:S.st,r:S.r,c:S.c,end,bpm:bpmNow(),thru:S.thru,dirty:+(blob.length!==flash.length||blob.some((x,i)=>x!==flash[i])),mem:blob.length,max:8112,
    L:S.L,Lk:S.Lk,Lr:S.Lr,cap:S.cap,cn:S.cn,cv:S.cv,set:S.set,se:S.se,warn:S.warn,up:Math.floor((Date.now()-S.t0)/1000),crc:0,q:0,clk:1};}
function cmd(q){const x=q.get('x'),a=q.has('a')?+q.get('a'):null;
  switch(x){case'next':next();break;case'prev':prev();break;case'snext':songStep(1);break;case'sprev':songStep(-1);break;
  case'restart':S.st=0;S.r=0;S.c=-1;break;case'song':S.set=255;load(a);break;case'jump':S.st=a;S.r=0;S.c=-1;break;
  case'set':a!==255?enterSet(a):S.set=255;break;case'thru':S.thru=a;break;case'warnok':S.warn=-1;break;case'reboot':break;
  case'learn':if(a===255)S.L=0;else{S.L=1;S.Lk=a;S.Lr=0;setTimeout(()=>{if(!S.L)return;m.settings.trig[a]={t:0,ch:0,n:80+a};blob=enc(m);S.bv++;S.L=0;S.Lr=1;persist();},1500);}break;
  case'cap':S.cap=a;if(a){const f=()=>{if(!S.cap)return;S.cv=[57,60,64,67];S.cn++;if(S.cap===1)S.cap=0;else setTimeout(f,2500);};setTimeout(f,1500);}break;}
  return{ok:1};}
const J=o=>new Response(JSON.stringify(o),{headers:{'Content-Type':'application/json'}});
const realFetch=window.fetch.bind(window);
window.fetch=async function(path,opt={}){
  if(typeof path!=='string'||!path.startsWith('/api/'))return realFetch(path,opt);
  await new Promise(r=>setTimeout(r,15));
  const u=new URL(path,'http://x');const p=u.pathname,post=(opt.method||'GET')==='POST';
  if(p==='/api/s')return J(status());
  if(p==='/api/c')return J(cmd(u.searchParams));
  if(p==='/api/log')return J({boot:'simulador (sin Arduino)',ov:0,e:[]});
  if(p==='/api/lyr')return post?J({ok:1}):new Response('');
  if(p==='/api/blob'&&!post)return new Response(blob.slice(),{headers:{'X-Bv':String(S.bv)}});
  if(p==='/api/blob'&&post){const b=new Uint8Array(opt.body);if(b.length>8112)return J({ok:0,e:'No cabe en la memoria'});try{m=dec(b);}catch(e){return J({ok:0,e:'Datos inválidos'});}blob=b;flash=b.slice();S.bv++;if(S.s>=m.songs.length)load(0);else if(S.st>=form().length){S.st=0;S.r=0;S.c=-1;}persist();return J({ok:1,bv:S.bv});}
  if(p==='/api/save'){flash=blob.slice();persist();return J({ok:1});}
  if(p==='/api/discard'){blob=flash.slice();m=dec(blob);S.bv++;persist();return J({ok:1});}
  return J({ok:0,e:'no existe'});};
window.SIM_RESET=()=>{flash=DEMO.slice();blob=DEMO.slice();m=dec(blob);S.bv++;load(0);persist();};

/* ---- Pedal virtual: los 4 switches del Ampero (pisada corta y mantenida) ---- */
function pedal(){
  const d=document.createElement('div');d.className='simped min';
  d.innerHTML='<button class="tgp" title="Mostrar/ocultar pedal">🦶</button><div class="sw"></div>';
  const box=d.querySelector('.sw');const lab=['◀ acorde','acorde ▶','◀ canción','canción ▶'];
  lab.forEach((t,k)=>{const b=document.createElement('button');b.innerHTML='<b>'+(k+1)+'</b><small>'+t+'</small>';let t0=0,timer=null,long=false;
    const down=e=>{e.preventDefault();b.classList.add('on');t0=Date.now();long=false;
      if(k<2){cmd(new URLSearchParams('x='+(k?'next':'prev')));window.qmTick&&window.qmTick();}
      else timer=setTimeout(()=>{long=true;cmd(new URLSearchParams('x='+(k===2?'mute':'restart')));window.synthStop&&synthStop();window.qmTick&&window.qmTick();toastSim(k===2?'Silenciado (mantuviste el 3)':'Canción reiniciada (mantuviste el 4)');},(m.settings.longMs||600));};
    const up=()=>{if(!b.classList.contains('on'))return;b.classList.remove('on');clearTimeout(timer);if(k<2&&window.qmPedalUp)window.qmPedalUp(k);if(k>=2&&!long){cmd(new URLSearchParams('x='+(k===2?'sprev':'snext')));window.qmTick&&window.qmTick();}};
    b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
    box.append(b);});
  d.querySelector('.tgp').onclick=()=>d.classList.toggle('min');
  document.body.append(d);}
